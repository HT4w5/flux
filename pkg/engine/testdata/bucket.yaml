# Bucket test chains
# Byte bucket: leak=0, small volume => first request passes, second overflows
- name: bucket-byte
  rules:
  - expressions:
    - BYTE-BUCKET:
        name: byte-test
        leak: 0
        volume: 1024
    statement:
      BAN: 15m

# Freq bucket: leak=0, volume=2 => third request triggers ban
- name: bucket-freq
  rules:
  - expressions:
    - FREQ-BUCKET:
        name: freq-test
        leak: 0
        volume: 2
    statement:
      BAN: 15m

# File ratio bucket: leak=0, volume=0.5
- name: bucket-file-ratio
  rules:
  - expressions:
    - FILE-RATIO-BUCKET:
        name: file-ratio-test
        leak: 0
        volume:
          method: constant
          volume: 0.5
    statement:
      BAN: 15m

# Byte bucket with leak
- name: bucket-byte-leak
  rules:
  - expressions:
    - BYTE-BUCKET:
        name: byte-leak-test
        leak: 512
        volume: 2048
    statement:
      BAN: 15m

# Freq bucket with leak
- name: bucket-freq-leak
  rules:
  - expressions:
    - FREQ-BUCKET:
        name: freq-leak-test
        leak: 1
        volume: 4
    statement:
      BAN: 15m

# File ratio bucket with leak
- name: bucket-file-ratio-leak
  rules:
  - expressions:
    - FILE-RATIO-BUCKET:
        name: file-ratio-leak-test
        leak: 0.1
        volume:
          method: constant
          volume: 5
    statement:
      BAN: 15m

# File ratio bucket with clamped-linear volume
- name: bucket-file-ratio-clamped-linear
  rules:
  - expressions:
    - FILE-RATIO-BUCKET:
        name: file-ratio-clamped-test
        leak: 0.1
        volume:
          method: clamped-linear
          intercept: 10
          slope: -1
          min: 5
          max: 9
    statement:
      BAN: 15m

# File ratio bucket with inverse-square volume
- name: bucket-file-ratio-inverse-square
  rules:
  - expressions:
    - FILE-RATIO-BUCKET:
        name: file-ratio-invsqrt-test
        leak: 0.1
        volume:
          method: inverse-square
          base: 5
          pivot: 100MB
    statement:
      BAN: 15m

# File ratio bucket with step volume
- name: bucket-file-ratio-step
  rules:
  - expressions:
    - FILE-RATIO-BUCKET:
        name: file-ratio-step-test
        leak: 0.1
        volume:
          method: step
          threshold: 30MB
          volume_low: 100
          volume_high: 5
    statement:
      BAN: 15m
